[package]
name = "hhm-interfaces"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Canonical Rust, JSON Schema, OpenAPI, AsyncAPI, and PostgreSQL contracts for Hacker House Medellín."
repository = "https://github.com/hacker-house-medellin/hhm-interfaces"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
url = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
