$schema: https://json-schema.org/draft/2020-12/schema
$id: UploadIntentCreate.yaml
type: object
properties:
  kind:
    $ref: "#/$defs/UploadKind"
  fileName:
    type: string
    minLength: 1
    maxLength: 255
  contentType:
    type: string
    minLength: 3
    maxLength: 128
  sizeBytes:
    type: string
    minimum: 1
    maximum: 10485760
  sha256:
    type: string
    pattern: ^[a-f0-9]{64}$
    description: Lower-case hexadecimal SHA-256 digest of the exact upload bytes.
  turnstileToken:
    type: string
    minLength: 1
    maxLength: 4096
required:
  - kind
  - fileName
  - contentType
  - sizeBytes
  - sha256
$defs:
  UploadKind:
    type: string
    enum:
      - resume
      - photo_id
