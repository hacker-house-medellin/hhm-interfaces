$schema: https://json-schema.org/draft/2020-12/schema
$id: ApplicationCreate.yaml
type: object
properties:
  email:
    $ref: "#/$defs/EmailAddress"
  linkedinUrl:
    $ref: "#/$defs/LinkedInUrl"
  legalName:
    type: string
    minLength: 2
    maxLength: 200
  dateOfBirth:
    type: string
    format: date
    description: Used only for age eligibility review and subject to the intake retention policy.
  nationality:
    type: string
    minLength: 2
    maxLength: 120
  phone:
    type: string
    minLength: 7
    maxLength: 32
  currentCity:
    type: string
    minLength: 2
    maxLength: 160
  githubUrl:
    type: string
    format: uri
  portfolioUrl:
    type: string
    format: uri
  entrepreneurshipIdea:
    type: string
    minLength: 80
    maxLength: 8000
  projectStage:
    $ref: "#/$defs/ProjectStage"
  stayPreference:
    $ref: "#/$defs/StayPreference"
  preferredStartMonth:
    type: string
    format: date
  communityContribution:
    type: string
    minLength: 40
    maxLength: 4000
  accessibilityOrAccommodationNotes:
    type: string
    maxLength: 4000
  allergyNotes:
    type: string
    maxLength: 2000
    description: Optional applicant-reported allergy information used only for accommodation and room placement. Do not use for admission scoring.
  noiseSensitivity:
    $ref: "#/$defs/SensitivityLevel"
  lightSensitivity:
    $ref: "#/$defs/SensitivityLevel"
  roomPreferenceNotes:
    type: string
    maxLength: 2000
    description: Optional preferences about room location, environment, or layout.
  roommatePreference:
    $ref: "#/$defs/RoommatePreference"
  preferredRoomOccupancy:
    type: integer
    minimum: 1
    maximum: 3
    description: Preferred total number of beds/occupants in the room. HHaus rooms may contain up to three beds.
  roommateForLowerCost:
    type: boolean
    description: Whether a shared room is desired partly to reduce the price of the stay.
  roommateForSocialConnection:
    type: boolean
    description: Whether a shared room is desired partly for more social connection.
  accommodationDataConsent:
    type: boolean
    const: true
    description: The applicant explicitly consents to HHaus processing allergy, sensory, accommodation, and room-preference answers only for accommodation and placement planning.
  resumeUploadId:
    $ref: "#/$defs/Uuid"
  photoIdUploadId:
    $ref: "#/$defs/Uuid"
  ageAndIdentityAttestation:
    type: boolean
    const: true
    description: The applicant attests that they are at least 18 and the submitted identity document is theirs.
  privacyNoticeVersion:
    type: string
    minLength: 1
    maxLength: 64
  turnstileToken:
    type: string
    minLength: 1
    maxLength: 4096
required:
  - email
  - linkedinUrl
  - legalName
  - dateOfBirth
  - nationality
  - phone
  - currentCity
  - entrepreneurshipIdea
  - projectStage
  - stayPreference
  - preferredStartMonth
  - communityContribution
  - noiseSensitivity
  - lightSensitivity
  - roommatePreference
  - preferredRoomOccupancy
  - roommateForLowerCost
  - roommateForSocialConnection
  - accommodationDataConsent
  - resumeUploadId
  - photoIdUploadId
  - ageAndIdentityAttestation
  - privacyNoticeVersion
$defs:
  EmailAddress:
    type: string
    minLength: 3
    maxLength: 320
    format: email
    description: A stable lower-case email address. The server normalizes the domain and preserves the local part.
  LinkedInUrl:
    type: string
    minLength: 20
    maxLength: 500
    format: uri
    description: An HTTPS LinkedIn profile URL. Redirectors and credential-bearing URLs are rejected.
  ProjectStage:
    type: string
    enum:
      - idea
      - prototype
      - early_revenue
      - growing
      - nonprofit_or_open_source
  StayPreference:
    type: string
    enum:
      - three_months
      - six_months
  SensitivityLevel:
    type: string
    enum:
      - none
      - low
      - moderate
      - high
      - prefer_not_to_say
    description: Applicant-reported sensitivity used only for room placement and accommodation planning.
  RoommatePreference:
    type: string
    enum:
      - private_room
      - open_to_roommates
      - prefer_roommates
      - flexible
    description: Whether the applicant wants a private room or is open to sharing with one or two roommates.
  Uuid:
    type: string
    format: uuid
    description: A UUID formatted identifier.
