$schema: https://json-schema.org/draft/2020-12/schema
$id: ApiError.yaml
type: object
properties:
  code:
    type: string
    minLength: 2
    maxLength: 64
  message:
    type: string
    minLength: 2
    maxLength: 500
  retryable:
    type: boolean
  submissionId:
    $ref: "#/$defs/Uuid"
required:
  - code
  - message
  - retryable
$defs:
  Uuid:
    type: string
    format: uuid
    description: A UUID formatted identifier.
