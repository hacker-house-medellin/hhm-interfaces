$schema: https://json-schema.org/draft/2020-12/schema
$id: UserPointsLedgerEntry.yaml
type: object
properties:
  entryId:
    $ref: "#/$defs/Uuid"
  subject:
    $ref: "#/$defs/SharedAuthSubject"
  delta:
    type: string
  reasonCode:
    type: string
    minLength: 2
    maxLength: 64
  sourceSubmissionId:
    $ref: "#/$defs/Uuid"
  occurredAt:
    type: string
    format: date-time
required:
  - entryId
  - subject
  - delta
  - reasonCode
  - occurredAt
$defs:
  Uuid:
    type: string
    format: uuid
    description: A UUID formatted identifier.
  SharedAuthSubject:
    type: string
    minLength: 8
    maxLength: 255
    description: An opaque Shared Auth subject. It is always derived from a verified session, never accepted from a form body.
