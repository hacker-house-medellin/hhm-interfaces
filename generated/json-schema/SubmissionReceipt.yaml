$schema: https://json-schema.org/draft/2020-12/schema
$id: SubmissionReceipt.yaml
type: object
properties:
  submissionId:
    $ref: "#/$defs/Uuid"
  kind:
    anyOf:
      - type: string
        const: pre_interest
      - type: string
        const: application
      - type: string
        const: referral
  acceptedAt:
    type: string
    format: date-time
  primaryPersistence:
    type: string
    const: stored
  supabasePersistence:
    type: string
    const: stored
required:
  - submissionId
  - kind
  - acceptedAt
  - primaryPersistence
  - supabasePersistence
$defs:
  Uuid:
    type: string
    format: uuid
    description: A UUID formatted identifier.
