name: Platform TypeSpec JSON Schema peer authority

on:
  pull_request:
    paths:
      - 'contracts/platform/**'
      - '.github/workflows/platform-tjsv-peer-authority.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/platform/**'
      - '.github/workflows/platform-tjsv-peer-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-tjsv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peer-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Compare independently authored platform peers
        uses: ORESoftware/typespec-json-schema-validator@03ccc0ecdfc70f9198c3ccf80718910961d3fde1
        with:
          typespec: contracts/platform/typespec/main.tsp
          schema: contracts/platform/json-schema/contract.schema.json
          report: .typespec-json-schema-validator/platform/report.json
          sarif: .typespec-json-schema-validator/platform/report.sarif
          contract_ir: .typespec-json-schema-validator/platform/contract-ir.json
          output_dir: .typespec-json-schema-validator/platform/generated
          max_probes: '64'
          quiet: 'false'

      - name: Require generated Schema B to remain comparison evidence
        run: |
          set -euo pipefail
          generated=.typespec-json-schema-validator/platform/generated/typespec.generated.schema.json
          test -s "$generated"
          test -s .typespec-json-schema-validator/platform/report.json
          test -s .typespec-json-schema-validator/platform/contract-ir.json
          node <<'NODE'
          const fs = require('node:fs');
          const schema = JSON.parse(fs.readFileSync('.typespec-json-schema-validator/platform/generated/typespec.generated.schema.json', 'utf8'));
          if (schema.$schema !== 'https://json-schema.org/draft/2020-12/schema') {
            throw new Error('TypeSpec comparison witness must be JSON Schema Draft 2020-12');
          }
          NODE

      - name: Build one-authority drift witness without touching either source
        run: |
          set -euo pipefail
          mkdir -p tmp/tjsv-negative
          node <<'NODE'
          const fs = require('node:fs');
          const source = 'contracts/platform/json-schema/contract.schema.json';
          const target = 'tmp/tjsv-negative/authored.schema.json';
          const schema = JSON.parse(fs.readFileSync(source, 'utf8'));
          schema.$defs ??= {};
          schema.$defs.__OresPeerAuthorityDriftCanary = {
            type: 'object',
            additionalProperties: false,
            properties: { impossible: { type: 'integer' } }
          };
          fs.writeFileSync(target, `${JSON.stringify(schema, null, 2)}\n`);
          NODE

      - name: TJSV must reject JSON-Schema-only drift
        id: drift
        continue-on-error: true
        uses: ORESoftware/typespec-json-schema-validator@03ccc0ecdfc70f9198c3ccf80718910961d3fde1
        with:
          typespec: contracts/platform/typespec/main.tsp
          schema: tmp/tjsv-negative/authored.schema.json
          report: .typespec-json-schema-validator/platform-negative/report.json
          sarif: .typespec-json-schema-validator/platform-negative/report.sarif
          contract_ir: .typespec-json-schema-validator/platform-negative/contract-ir.json
          output_dir: .typespec-json-schema-validator/platform-negative/generated
          max_probes: '32'
          quiet: 'true'

      - name: Require fail-closed negative control
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          set -euo pipefail
          test "$DRIFT_OUTCOME" = failure

      - name: Prove authored peers were not rewritten
        run: |
          set -euo pipefail
          git diff --exit-code -- contracts/platform/typespec/main.tsp contracts/platform/json-schema/contract.schema.json
          test -z "$(git status --porcelain -- contracts/platform/typespec/main.tsp contracts/platform/json-schema/contract.schema.json)"

      - name: Retain comparison evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-tjsv-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .typespec-json-schema-validator/platform/
            .typespec-json-schema-validator/platform-negative/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
