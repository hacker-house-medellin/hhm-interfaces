name: Platform contracts

on:
  pull_request:
    paths:
      - "contracts/platform/**"
      - "conformance/platform/**"
      - "generated/platform/**"
      - "runtime/platform*.mjs"
      - "tests/platform-*"
      - "tests/platform-rust-witness/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/platform-contracts.yml"
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Prove authority and generated-artifact parity
        run: npm run check:platform
      - name: Regenerate deterministic artifacts
        run: npm run generate:platform
      - name: Exercise JSON Schema, generated validator, state machines, and Protobuf
        run: npm run test:platform
      - name: Reject generated drift
        run: git diff --exit-code -- generated/platform
      - name: Compile generated Rust, SeaORM, and Diesel lanes
        run: cargo check --locked --manifest-path tests/platform-rust-witness/Cargo.toml
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=moderate
