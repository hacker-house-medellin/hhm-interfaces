name: Resident Contract IR selfcheck (public input authorities)

on:
  pull_request:
    paths:
      - .github/workflows/reusable-resident-contract-admission.yml
      - .github/workflows/resident-contract-selfcheck.yml
  workflow_dispatch:

permissions:
  contents: read

# Call the same reviewed reusable admission path as runtime consumers.
# All authority inputs are public and pinned; there are no source transfers,
# write permissions, secrets, self-hosted runners, or alternate proof paths.
jobs:
  resident-contract-selfcheck:
    uses: ./.github/workflows/reusable-resident-contract-admission.yml
    with:
      consumer_repository: hacker-house-medellin/hhm-interfaces
      consumer_role: hhm-public-authority-selfcheck
