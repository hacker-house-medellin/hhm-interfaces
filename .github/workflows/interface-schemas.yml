name: interface-schemas

# Every JSON Schema published by this repo is checked for well-formedness, for
# resolvable $refs, and against its own examples. See schema/README-contract.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-schemas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schemas:
    name: JSON Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run validator regression tests
        run: python3 -m unittest discover -s scripts -p 'test_validate_schemas.py'
      - name: Validate with the bundled structural checks
        run: python3 scripts/validate_schemas.py --format github
      - name: Validate against the JSON Schema meta-schema
        run: |
          python3 -m pip install --quiet jsonschema
          python3 scripts/validate_schemas.py
