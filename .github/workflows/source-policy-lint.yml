# Managed by ores-otel source-policy fleet rollout.
name: Pre-build source policy lint

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy:
    # STAGING ONLY: pin to independently reviewed and merged upstream #26 SHA before merging.
    uses: ores-otel/.github/.github/workflows/source-policy-lint.yml@97ca3010d02bf9af2b6d13c4deb7064d4e2cad2c
    permissions:
      contents: read

  caller-pin-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify reviewed caller head and immutable central policy pin
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
          node --test tests/source-policy-caller.test.mjs
