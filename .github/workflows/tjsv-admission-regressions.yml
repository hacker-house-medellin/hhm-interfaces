name: TJSV resident operations admission regressions
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tjsv-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - name: Require fresh resident operations parity and recorded cases
        uses: ORESoftware/typespec-json-schema-validator@b5bd51946b53c00b1daeb2723c0b5d54eaeafab7
        with:
          typespec: contracts/resident-operations/v1/main.tsp
          schema: contracts/resident-operations/v1/authored.schema.json
          instances: contracts/resident-operations/v1/instances
          report: .typespec-json-schema-validator/regressions/report.json
          contract_ir: .typespec-json-schema-validator/regressions/contract-ir.json
          output_dir: .typespec-json-schema-validator/regressions/generated
          max_probes: "64"
      - name: Require positive admission and seven canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@b5bd51946b53c00b1daeb2723c0b5d54eaeafab7
        with:
          contract_ir: .typespec-json-schema-validator/regressions/contract-ir.json
          report: .typespec-json-schema-validator/regressions/report.json
          typespec: contracts/resident-operations/v1/main.tsp
          schema: contracts/resident-operations/v1/authored.schema.json
          generated_schema: .typespec-json-schema-validator/regressions/generated/typespec.generated.schema.json
          expected_declarations: '["HHaus.ResidentOperations.V1.ActorRole","HHaus.ResidentOperations.V1.GuestVisitStatus","HHaus.ResidentOperations.V1.ResourceKind","HHaus.ResidentOperations.V1.ReservationStatus","HHaus.ResidentOperations.V1.MealPlanStatus","HHaus.ResidentOperations.V1.PollStatus","HHaus.ResidentOperations.V1.VoteVisibility","HHaus.ResidentOperations.V1.InvoiceStatus","HHaus.ResidentOperations.V1.PaymentStatus","HHaus.ResidentOperations.V1.AgreementAcceptanceStatus","HHaus.ResidentOperations.V1.SyncStore","HHaus.ResidentOperations.V1.SyncStatus","HHaus.ResidentOperations.V1.AssignmentStatus","HHaus.ResidentOperations.V1.ChatGroupKind","HHaus.ResidentOperations.V1.AccessGrantStatus","HHaus.ResidentOperations.V1.GuestVisit","HHaus.ResidentOperations.V1.ResourceReservation","HHaus.ResidentOperations.V1.MealPlan","HHaus.ResidentOperations.V1.PollOption","HHaus.ResidentOperations.V1.CommunityPoll","HHaus.ResidentOperations.V1.PollVote","HHaus.ResidentOperations.V1.RentInvoice","HHaus.ResidentOperations.V1.PaymentRecord","HHaus.ResidentOperations.V1.AgreementAcceptance","HHaus.ResidentOperations.V1.OnboardingCheckpoint","HHaus.ResidentOperations.V1.PersistenceReceipt","HHaus.ResidentOperations.V1.AssignmentRequest","HHaus.ResidentOperations.V1.AssignmentDecision","HHaus.ResidentOperations.V1.AssignmentResult","HHaus.ResidentOperations.V1.ChatGroupReference","HHaus.ResidentOperations.V1.DeveloperAccessGrant","HHaus.ResidentOperations.V1.ResidentOperationsEvent"]'
          verification: .typespec-json-schema-validator/regressions/verification.json
      - name: Preserve source authorities and recorded cases
        run: git diff --exit-code -- contracts/resident-operations/v1/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: tjsv-resident-regressions-${{ github.event.pull_request.head.sha || github.sha }}
          path: .typespec-json-schema-validator/regressions/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
# DEN-3828 / upstream issue #20. All 32 resident-operations v1 data declarations.
# Not proof of runtime money/lifecycle/cross-field rules, legal effectiveness,
# browser authority, Stripe reconciliation, authorization, or solver privacy.
# Existing native CI, generated-contract, and policy gates remain mandatory.
