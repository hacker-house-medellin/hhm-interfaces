name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Verify repository policy
        run: python3 scripts/verify_repo.py
      - name: Compile TypeSpec and reject generated drift
        run: |
          npm ci
          npm run generate:intake
          git diff --exit-code -- generated
      - name: Validate resident-operations peer authorities
        uses: ORESoftware/typespec-json-schema-validator@282883afc4645f3303ed746bdb1e1571475724c5
        with:
          typespec: contracts/resident-operations/v1/main.tsp
          schema: contracts/resident-operations/v1/authored.schema.json
          instances: contracts/resident-operations/v1/instances
          report: .typespec-json-schema-validator/resident-operations-v1.json
          output_dir: .typespec-json-schema-validator/generated
          quiet: "true"
      - name: Test Rust contracts
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
