name: route-map-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact interface candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: hhm-interfaces
          persist-credentials: false
      - name: Verify exact interface candidate
        working-directory: hhm-interfaces
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out exact lib-core proposal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hacker-house-medellin/hhm-lib-core
          ref: 85a5c343710ab641959513e01e7fa6477b264b2a
          path: hhm-lib-core
          persist-credentials: false
      - name: Verify lib-core proposal identity
        working-directory: hhm-lib-core
        run: test "$(git rev-parse HEAD)" = "85a5c343710ab641959513e01e7fa6477b264b2a"
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate route-map twins
        working-directory: hhm-interfaces
        run: python3 scripts/check-route-sync.py --root .
