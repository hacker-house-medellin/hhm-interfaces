name: route-map-sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: route-map-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact interfaces candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile scripts/check-route-sync.py

      - name: Validate canonical authority change
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-route-sync.py --root . --skip-identical
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Check out lib-core downstream twin
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hacker-house-medellin/hhm-lib-core
          path: hhm-lib-core
          persist-credentials: false

      - name: Enforce published twin parity
        if: github.event_name != 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-route-sync.py --root .
          git diff --check
